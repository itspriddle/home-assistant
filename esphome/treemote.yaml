substitutions:
  name: treemote
  api_encryption_key: !secret treemote__api_encryption_key

packages:
  base: !include common/base.yaml

esphome:
  name: ${name}
  friendly_name: treemote
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - button.press: tree_color_clear
      - delay: 500ms
      - button.press: tree_brightness_max

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

ota:
  - platform: esphome
    password: !secret treemote__ota_password

sensor:
  - platform: internal_temperature
    name: "ESP32 CPU Temperature"
    update_interval: 60s

remote_transmitter:
  pin:
    number: GPIO5
    mode:
      output: true
  carrier_duty_percent: 100%
  non_blocking: false

button:
  - platform: template
    name: "Brightness Max"
    id: tree_brightness_max
    on_press:
      then:
        - repeat:
            count: 12
            then:
              - button.press: tree_brighter
              - delay: 100ms

  - platform: template
    name: "Brightness Min"
    id: tree_brightness_min
    on_press:
      then:
        - repeat:
            count: 12
            then:
              - button.press: tree_dimmer
              - delay: 100ms

  - platform: template
    name: "Brighter"
    id: tree_brighter
    on_press:
      - remote_transmitter.transmit_raw:
          code: [
            11450, -5275,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -1100, 1100, -1100, 1100, -1100, 1100, -1100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -1100, 1100, -1100, 1100, -1100, 1100, -1100,
            1100, -1100, 1100, -1100, 1100, -1100, 1100, -3100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -1100,
            1100, -11450
          ]
          repeat:
            times: 3
            wait_time: 0s

  - platform: template
    name: "Dimmer"
    id: tree_dimmer
    on_press:
      - remote_transmitter.transmit_raw:
          code: [
            11450, -5275,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -1100, 1100, -1100, 1100, -1100, 1100, -1100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -1100, 1100, -1100, 1100, -1100, 1100, -1100,
            1100, -1100, 1100, -1100, 1100, -1100, 1100, -1100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -11450
          ]
          repeat:
            times: 3
            wait_time: 0s

  - platform: template
    name: "Color + Clear"
    id: tree_color_clear
    on_press:
      - remote_transmitter.transmit_raw:
          code: [
            11450, -5275,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -1100, 1100, -1100, 1100, -1100, 1100, -1100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -1100, 1100, -1100, 1100, -1100, 1100, -1100,
            1100, -1100, 1100, -3100, 1100, -1100, 1100, -3100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -3100, 1100, -1100, 1100, -3100, 1100, -1100,
            1100, -11450
          ]
          repeat:
            times: 6
            wait_time: 0s

  - platform: template
    name: "Clear"
    id: tree_clear
    on_press:
      - remote_transmitter.transmit_raw:
          code: [
            11450, -5275,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -1100, 1100, -1100, 1100, -1100, 1100, -1100,
            1100, -3100, 1100, -3100, 1100, -3100, 1100, -3100,
            1100, -1100, 1100, -1100, 1100, -1100, 1100, -1100,
