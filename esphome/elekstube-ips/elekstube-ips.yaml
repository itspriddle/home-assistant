# EleksTube IPS: HA clock / status display. 4 x 135x240 IPS panels, 4 buttons.
#
# Rendering, modes and animation live in components/elekstube_ui. The entities
# below are the source of truth for settings; buttons act on those entities
# so HA and the device never disagree.
#
# Buttons (same pattern in every mode):
#   POWER  tap: next mode            hold: back to Clock
#   MODE   tap: Clock -> peek date   hold: toggle 12/24 h
#   LEFT / RIGHT  tap: previous / next face

substitutions:
  name: ha-elekstube-ips
  api_encryption_key: !secret elekstube_ips__api_encryption_key

packages:
  base: !include ../common/base.yaml
  hardware: !include ../common/hardware/elekstube-ips.yaml

esphome:
  name: ${name}
  friendly_name: "EleksTube IPS"
  on_boot:
    - priority: 600
      then:
        - ds1307.read_time: rtc

external_components:
  - source:
      type: local
      path: components
    components: [elekstube_ui]

logger:

# --- Time: RTC keeps it offline; HA or SNTP keep the RTC right ---
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - ds1307.write_time:
          id: rtc
  - platform: sntp
    id: ntp_time
    on_time_sync:
      - ds1307.write_time:
          id: rtc

# --- Fonts ---
# Faces are candidates to judge on the real panels; drop the losers to save
# flash. Big-digit fonts only carry the glyphs the clock needs.
font:
  - file: { type: gfonts, family: Oswald, weight: 600 }
    id: face_oswald
    size: 230
    bpp: 4
    glyphs: "0123456789-"
  - file: { type: gfonts, family: Fredoka, weight: 600 }
    id: face_fredoka
    size: 220
    bpp: 4
    glyphs: "0123456789-"
  - file: { type: gfonts, family: Orbitron, weight: 700 }
    id: face_orbitron
    size: 165
    bpp: 4
    glyphs: "0123456789-"
  - file: { type: gfonts, family: Oswald, weight: 500 }
    id: label_font
    size: 26
    bpp: 4
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-:%."

elekstube_ui:
  id: ui
  display_id: tft
  time_id: rtc
  spi_id: tft_spi
  label_font: label_font
  dc_pin:
    number: ${tft_dc_pin}
    allow_other_uses: true
  panel_power_pin: ${panel_power_pin}
  select_data_pin: ${select_data_pin}
  select_clock_pin: ${select_clock_pin}
  select_latch_pin: ${select_latch_pin}
  # Order and names must match the Face select below.
  faces:
    - name: Oswald
      font: face_oswald
      color: "#FFB347"
    - name: Fredoka
      font: face_fredoka
      color: "#FF9ECF"
      color_bottom: "#FFD8A8"
      accent: "#FF9ECF"
    - name: Orbitron
      font: face_orbitron
      color: "#4DE8FF"

# --- Settings (HA entities) ---
select:
  - platform: template
    id: mode_select
    name: "Mode"
    icon: mdi:view-carousel
    options: [Clock, Date]
    initial_option: Clock
    optimistic: true
    on_value:
      - lambda: id(ui).set_mode(i);
  - platform: template
    id: face_select
    name: "Face"
    icon: mdi:format-font
    entity_category: config
    options: [Oswald, Fredoka, Orbitron]
    initial_option: Oswald
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(ui).set_face(i);
  - platform: template
    id: transition_select
    name: "Transition"
    icon: mdi:animation-play
    entity_category: config
    options: [Roll, Fade, None]
    initial_option: Roll
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(ui).set_transition(i);

switch:
  - platform: template
    id: use_24h
    name: "24 Hour"
    icon: mdi:hours-24
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(ui).set_use_24h(true);
    on_turn_off:
      - lambda: id(ui).set_use_24h(false);
  - platform: template
    id: seconds_bar
    name: "Seconds Bar"
    icon: mdi:progress-clock
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: id(ui).set_seconds_bar(true);
    on_turn_off:
      - lambda: id(ui).set_seconds_bar(false);
  - platform: template
    id: display_on
    name: "Display"
    icon: mdi:monitor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: id(ui).set_display_on(true);
    on_turn_off:
      - lambda: id(ui).set_display_on(false);

# Software dimming: the panels have no PWM backlight.
number:
  - platform: template
    id: brightness
    name: "Brightness"
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    mode: slider
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(ui).set_brightness(x / 100.0f);

# --- Buttons (defined in the hardware package; actions added here) ---
binary_sensor:
  - id: !extend button_power
    on_multi_click:
      - timing: [ON for at most 600ms, OFF for at least 10ms]
        then:
          - select.next:
              id: mode_select
              cycle: true
      - timing: [ON for at least 800ms]
        then:
          - select.first: mode_select
  - id: !extend button_mode
    on_multi_click:
      - timing: [ON for at most 600ms, OFF for at least 10ms]
        then:
          - if:
              condition:
                lambda: return id(mode_select).active_index().value_or(0) == 0;
              then:
                - lambda: id(ui).peek_date(5000);
      - timing: [ON for at least 800ms]
        then:
          - switch.toggle: use_24h
  - id: !extend button_left
    on_press:
      - select.previous:
          id: face_select
          cycle: true
  - id: !extend button_right
    on_press:
      - select.next:
          id: face_select
          cycle: true
