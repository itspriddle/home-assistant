views:
- title: Main
  sections:
  - type: grid
    cards:
    - type: heading
      icon: mdi:calendar
      heading: Now
      heading_style: title
    - type: custom:calendar-card-pro
      entities:
        - entity: calendar.home
          accent_color: home-assistant
        - entity: calendar.josh_work
          accent_color: home-assistant
          filter_field: description
          allowlist: 'google\.com'
        - entity: calendar.chrys
          accent_color: home-assistant
          filter_field: description
          allowlist: 'zoom\.us'
        - entity: calendar.holidays
          accent_color: home-assistant
      show_empty_days: true
      filter_duplicates: true
      show_location: false
      date_vertical_alignment: 'top'
      weather:
        entity: weather.forecast_home
        position: date
        date:
          show_conditions: true
          show_high_temp: true
          show_low_temp: false
          icon_size: 14px
          font_size: 12px
          color: var(--primary-text-color)
        event:
          show_conditions: true
          show_temp: true
          icon_size: 14px
          font_size: 12px
          color: var(--primary-text-color)
    - type: custom:clock-weather-card
      entity: weather.forecast_home
    - type: custom:emby-now-playing-card
      entity: sensor.emby_now_playing
      library:
      - sensor.emby_movies
      - sensor.emby_episodes
  - type: grid
    cards:
    - type: heading
      heading: Environment
      heading_style: title
      icon: mdi:thermometer
    - type: custom:bubble-card
      card_type: climate
      sub_button:
        main:
        - name: HVAC modes menu
          select_attribute: hvac_modes
          state_background: false
          show_arrow: true
          sub_button_type: select
          show_state: true
        - entity: climate.thermostat
          sub_button_type: select
          select_attribute: fan_modes
          name: Fan
        - entity: select.thermostat_current_mode
          sub_button_type: select
          select_attribute: hvac_modes
          name: ''
          show_state: false
          icon: mdi:cog
        bottom:
        - entity: sensor.thermostat_running_today
          name: Usage
          show_name: false
          show_state: true
          icon: mdi:clock
          state_background: false
          show_background: true
        - entity: sensor.thermostat_current_temperature
          show_state: true
          show_name: false
          icon: mdi:thermometer
          state_background: false
          show_background: true
          name: Temperature
        - entity: sensor.thermostat_current_humidity
          icon: mdi:water-percent
          show_icon: true
          state_background: false
          show_state: true
      entity: climate.thermostat
      show_state: false
      show_last_changed: false
      show_last_updated: false
      show_attribute: true
      show_name: true
      force_icon: false
      grid_options:
        columns: 12
      state_color: false
      hide_temperature: false
      button_action:
        tap_action:
          action: more-info
      icon: mdi:home-thermometer-outline
      attribute: hvac_action
      main_buttons_position: bottom
      rows: 2.406
      show_icon: true
      scrolling_effect: true
      name: ''
      modules: []
      rmn_conditional_climate_coloring:
        default_configuration:
          card_background:
            color_mode: preset
            color_preset: state
    - type: custom:mini-graph-card
      name: Temperature
      entities:
      - entity: sensor.living_room_temperature
        name: Living Room
      - entity: sensor.office_temperature
        name: Office
      - entity: sensor.bedroom_temperature
        name: Bedroom
      show:
        labels: true
        labels_secondary: true
        average: true
        extrema: true
    - type: custom:mini-graph-card
      name: Humidity
      icon: mdi:water-percent
      entities:
      - entity: sensor.shelly_blu_h_t_2a9f_humidity
        name: Office
      - entity: sensor.thermostat_current_humidity
        name: Living Room
      show:
        labels: true
        average: true
        extrema: true
    - type: custom:bubble-card
      card_type: button
      button_type: slider
      sub_button:
        main: []
        bottom: []
      entity: sensor.thermostat_running_today
      show_attribute: true
      name: HVAC Usage
      attribute: state_class
      show_state: true
    - type: custom:mini-graph-card
      name: Heating History (Last 7 Days)
      icon: mdi:fire
      entities:
      - entity: sensor.thermostat_heating_today
        name: Heating
      show:
        graph: bar
        labels: true
      group_by: date
      aggregate_func: max
      hours_to_show: 168
      bar_spacing: 10
  badges:
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: sensor.shelly_blu_h_t_2a9f_humidity
    name:
      type: area
    show_entity_picture: false
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: sensor.office_temperature
    name:
      type: area
    color: red
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: sensor.thermostat_current_humidity
    name:
      type: area
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: sensor.bedroom_temperature
    name:
      type: area
    color: red
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: sensor.living_room_temperature
    name:
      type: area
    color: red
  - type: entity
    show_name: true
    show_state: false
    show_icon: true
    entity: binary_sensor.meeting
    state_content:
    - chrys_in_meeting
    - josh_in_meeting
    name: Any Meeting
  - type: entity
    show_name: true
    show_state: false
    show_icon: true
    entity: binary_sensor.josh_meeting
    name:
      type: entity
    show_entity_picture: false
  - type: entity
    show_name: true
    show_state: false
    show_icon: true
    entity: binary_sensor.chrys_meeting
    name:
      type: entity
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: binary_sensor.office_motion
    state_content:
    - state
    - last_changed
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: binary_sensor.living_room_occupancy
    icon: mdi:account-alert
    state_content:
    - state
    - last_changed
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: binary_sensor.living_room_motion
    state_content:
    - state
    - last_changed
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: binary_sensor.bedroom_motion
    state_content:
    - state
    - last_changed
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: binary_sensor.bedroom_occupancy
    icon: mdi:account-alert
    state_content:
    - state
    - last_changed
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: binary_sensor.office_occupancy
    icon: mdi:account-alert
    state_content:
    - state
    - last_changed
  header:
    layout: center
    badges_position: top
    badges_wrap: wrap
  type: sections
  max_columns: 2
  icon: mdi:home
  cards: []
- title: Network
  path: network
  icon: mdi:lan
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Internet
      icon: mdi:web
    - type: tile
      entity: sensor.speedtest_tracker_download
      name: Down
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.speedtest_tracker_upload
      name: Up
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.speedtest_tracker_ping
      name: Ping
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.speedtest_tracker_last_test_time
      name: Last test
      icon: mdi:clock-check-outline
      grid_options:
        columns: 12
    - type: statistics-graph
      title: Speed (daily, 30 days)
      entities:
      - entity: sensor.speedtest_tracker_download
        name: Down
      - entity: sensor.speedtest_tracker_upload
        name: Up
      period: day
      days_to_show: 30
      stat_types:
      - mean
      - min
      chart_type: line
    - type: statistics-graph
      title: Ping (daily, 30 days)
      entities:
      - entity: sensor.speedtest_tracker_ping
        name: Ping
      period: day
      days_to_show: 30
      stat_types:
      - mean
      - max
      chart_type: line
