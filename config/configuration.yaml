# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/custom-brand-icons/custom-brand-icons.js

# Dashboard registrations: one file per dashboard, named by URL path (must contain a hyphen).
lovelace:
  resource_mode: yaml
  resources: !include lovelace/resources.yaml
  dashboards: !include_dir_named lovelace/dashboards

homeassistant:
  packages: !include_dir_named packages

# Written by the UI editors. Hand-written config goes in packages/.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
